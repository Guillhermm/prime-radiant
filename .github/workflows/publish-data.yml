name: publish-data
# Rebuilds the tiles from the public FIRMS yearly country files and publishes them to R2
# (docs/deploy.md, "Data hosting"). Manual only. `global` reads the 48 all-countries zips
# (about 9.8 GB) with no clip; `brazil` reads the Brazil CSVs (about 3 GB) clipped to Brazil.
on:
  workflow_dispatch:
    inputs:
      extent:
        description: Which data to build
        type: choice
        options: [global, brazil]
        default: global
permissions:
  contents: read
concurrency:
  group: publish-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EXTENT: ${{ inputs.extent }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The runner has 14 GB of SSD; the global zips alone take 9.8 GB.
      - name: Free disk space
        if: env.EXTENT == 'global'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Download the FIRMS country files
        run: |
          if [ "$EXTENT" = global ]; then
            node tools/fetch-country.mjs --scope global --out raw/global --to 2025
          else
            node tools/fetch-country.mjs --out raw/country --to 2025
          fi
      - name: Download the Natural Earth admin-1 file (global hotspot names)
        if: env.EXTENT == 'global'
        run: |
          mkdir -p raw/ne
          curl -fsSL -o raw/ne/admin1.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_1_states_provinces.geojson
          echo "22d0e3ad85eb3e27f17cabf8ba2d50e554fbc27a87796ff891d958185da62fb5  raw/ne/admin1.geojson" | sha256sum -c -
      - name: Build tiles
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          # A new version name each run: published versions are immutable and never rewritten.
          VERSION="$(date -u +%Y%m%d%H%M)"
          if [ "$EXTENT" = global ]; then
            node pipeline/build.js --in raw/global --out raw/build --admin1 raw/ne/admin1.geojson --data-version "$VERSION"
            rm -rf raw/global
          else
            node pipeline/build.js --in raw/country --out raw/build --domain pipeline/domain/brazil.geojson --admin1 pipeline/domain/brazil-admin1.geojson --data-version "$VERSION"
          fi
          du -sh raw/build
      - name: Test
        run: node --test
        env:
          REQUIRE_CHROME: '1'
      - name: Publish to R2
        run: node pipeline/publish.js --in raw/build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
