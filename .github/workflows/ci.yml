name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
        env:
          # ubuntu-latest ships Google Chrome; fail instead of skipping the end-to-end tests if it ever goes missing.
          REQUIRE_CHROME: '1'
